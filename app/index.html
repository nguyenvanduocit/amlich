<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Âm Lịch // NULLSECT</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Âm lịch Việt Nam — lịch âm, can chi, tiết khí, giờ hoàng đạo, ghi chú cá nhân.">

<!-- PWA: manifest-only setup (no service worker → no offline cache, but the
     app is installable on iOS Home Screen and shows the proper icon/theme
     chrome on Android/desktop Chrome when "Install app" is triggered
     manually. Install-prompt auto-fire on Chrome/Android requires a SW;
     intentionally opted out per project scope. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#050507">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icon-apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Âm Lịch">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap">

<link rel="stylesheet" href="css/tokens.css">

<style>
  /* App shell — layout chrome. Design tokens come from tokens.css. */
  html, body { height: 100%; }
  body {
    overflow: hidden; /* viewport-fit app */
    display: flex;
    flex-direction: column;
    padding: 24px 24px 32px;
    box-sizing: border-box;
  }

  /* The whole "calendar book" — a single bounded frame that houses both
     the tab bar (top strip) and the active view (body). */
  #page {
    width: 100%;
    max-width: 1280px;
    margin: 0 auto;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
    border: 3px solid var(--line);
    box-shadow: 10px 10px 0 0 var(--magenta);
  }

  /* Tab bar (top strip of the book) */
  #tabs {
    display: flex;
    align-items: stretch;
    gap: 0;
    background: var(--bg-2);
    border-bottom: 3px solid var(--ink);
    padding: 0;
    flex: 0 0 auto;
    font-family: var(--f-mono);
  }
  .tab {
    font-family: var(--f-mono);
    font-weight: 700;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    padding: 14px 20px;
    background: transparent;
    color: var(--ink-dim);
    border: 0;
    border-right: 2px solid var(--ink);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    transition: color 80ms ease, background 80ms ease;
  }
  .tab:hover { color: var(--ink); background: var(--bg-3); }
  .tab.on { color: #0a0a0b; background: var(--lime); }
  .tab .tab-k { font-size: 10px; color: var(--ink-mute); letter-spacing: 0.2em; }
  .tab.on .tab-k { color: rgba(10,10,11,0.55); }
  .tab-meta {
    margin-left: auto;
    padding: 0 22px;
    display: flex;
    align-items: center;
    color: var(--ink-mute);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  /* View body — below the tab strip, inside the page frame */
  #view {
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
    position: relative;
  }

  /* Donate chip — sibling control to theme chip, links to donate.aiocean.io.
     Mirrors the theme chip's shape; primary accent is magenta (theme's is lime).
     Colocated with theme chip: shares the same @media override blocks below. */
  #ns-donate-chip {
    position: relative;
    margin: 8px 8px 8px 0;
    align-self: center;
    font-family: var(--f-mono);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink);
    background: var(--bg-2);
    border: 2px solid var(--line);
    padding: 7px 10px 7px 8px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    box-shadow: 4px 4px 0 0 var(--magenta);
    transition: transform 80ms ease, box-shadow 80ms ease;
    text-decoration: none;
  }
  #ns-donate-chip:hover {
    transform: translate(-1px, -1px);
    box-shadow: 5px 5px 0 0 var(--magenta);
    color: var(--magenta);
  }
  #ns-donate-chip .ns-donate-ico {
    width: 10px;
    height: 10px;
    background: var(--magenta);
    box-shadow: 0 0 8px var(--magenta);
  }
  #ns-donate-chip .ns-donate-k {
    color: var(--ink-dim);
    border-left: 1px solid var(--ink-mute);
    padding-left: 8px;
    margin-left: 4px;
    font-size: 10px;
  }

  /* ─ Responsive ────────────────────────────────────────────────────────
     Desktop (>1024px): fit-viewport "book" — body overflow hidden, #page
     and #view constrained to viewport height. Inner views manage their own
     scrolling/sizing via internal flex rules.

     Mobile/tablet (≤1024px): relax that constraint so the page grows with
     content and the body scrolls naturally. Inner views switch from
     fixed-height with internal overflow to content-sized with visible
     overflow — otherwise long content (year mosaic, day checklist) is
     trapped inside an unscrollable pane on touch devices. */
  @media (max-width: 1024px) {
    html, body { height: auto; }
    body {
      overflow: visible;
      min-height: 100vh;
    }
    #page {
      overflow: visible;
      flex: 0 0 auto;
    }
    #view {
      overflow: visible;
      flex: 0 0 auto;
      min-height: 0;
    }
  }

  @media (max-width: 768px) {
    body { padding: 14px; }
    #page { border-width: 2px; box-shadow: 6px 6px 0 0 var(--magenta); }
    /* Tab bar compressed — still single row, never wrap or scroll */
    .tab { padding: 11px 14px; font-size: 11px; letter-spacing: 0.1em; gap: 8px; }
    .tab .tab-k { font-size: 9px; letter-spacing: 0.16em; }
    .tab-meta { display: none; }
    #ns-donate-chip {
      margin: 6px 8px 6px 0;
      padding: 6px 8px;
      font-size: 10px;
      box-shadow: 3px 3px 0 0 var(--magenta);
    }
    #ns-donate-chip .ns-donate-k { display: none; }
  }

  @media (max-width: 480px) {
    body { padding: 8px; }
    #page { box-shadow: 4px 4px 0 0 var(--magenta); }
    /* Tab row fits 3 tabs + chip on a 360-wide phone without wrap.
       Shrink aggressively but preserve tap target height (≥ 36px). */
    .tab { padding: 10px 10px; font-size: 10px; letter-spacing: 0.08em; gap: 6px; }
    .tab .tab-k { display: none; }
    #ns-donate-chip {
      margin: 5px 4px 5px 0;
      padding: 5px 7px;
      font-size: 9px;
      letter-spacing: 0.08em;
      gap: 6px;
    }
  }

  @media (max-width: 360px) {
    body { padding: 6px; }
    .tab { padding: 9px 8px; font-size: 9px; letter-spacing: 0.06em; }
    #ns-donate-chip { padding: 5px 6px; font-size: 8px; }
  }

  /* Can-chi label inside month grid cells (not a nav element). */
  .mv-chi {
    font-size: 9px;
    color: var(--ink-mute);
    letter-spacing: 0.04em;
    line-height: 1.2;
  }

  /* Unified prev/today/next nav — shared by Day, Month, Year views.
     One component, one label scheme, one keyboard contract (←/→/T).
     Layout container; inline so each view can place it inside its hero. */
  .nav-strip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .nav-btn {
    font-family: var(--f-mono);
    font-size: 10px;
    font-weight: 700;
    background: var(--bg-3);
    border: 2px solid var(--ink);
    color: var(--ink);
    padding: 3px 9px;
    cursor: pointer;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .nav-btn:hover { border-color: var(--lime); color: var(--lime); }
  .nav-btn--today {
    background: var(--lime);
    border-color: var(--lime);
    color: #0a0a0b;
  }
  .nav-btn--today:hover { color: #0a0a0b; }

  /* ─ TODAY: keep interior clean, add a solid lime sticker corner ───────
     Strategy: thick 4px lime outline + solid lime "● HÔM NAY" badge
     bottom-right. No bg tint, no glow — so lun/chi/tag stay readable.
     When today is also selected, add lime inset ring inside cyan outline. */
  .vA-cell.today {
    outline: 4px solid var(--lime);
    outline-offset: -4px;
  }
  .vA-cell.today .sol { color: var(--lime) !important; font-weight: 800; }
  .vA-cell.today .hd  { color: var(--lime); opacity: 1; font-weight: 800; }
  .vA-cell.today::before {
    content: '● HÔM NAY';
    position: absolute;
    bottom: 0;
    right: 0;
    background: var(--lime);
    color: #0a0a0b;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.18em;
    padding: 2px 6px;
    font-family: var(--f-mono);
    z-index: 4;
    pointer-events: none;
  }
  .vA-cell.today.selected {
    outline: 4px solid var(--cyan);
    outline-offset: -4px;
    box-shadow: inset 0 0 0 3px var(--lime);
  }

  /* ─ DAY VIEW · REVAMPED LAYOUT ─────────────────────────────────────────
     Replace the old 3-col body (hour grid | can-chi trio | notes) with:
       1. a 4-col horizontal "spec sheet" strip (Ngày/Tháng/Năm/Tiết khí)
       2. a 2-col main body — Notes (big, LEFT) + Giờ hoàng đạo (RIGHT)
     This keeps can-chi from ever stretching vertically + gives notes
     proper real estate. */

  /* Horizontal spec strip */
  .DD-specs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    background: var(--bg-2);
    border: 3px solid var(--ink);
    flex: 0 0 auto;
  }
  .DD-spec {
    padding: 10px 14px;
    border-right: 2px solid var(--ink);
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .DD-spec:last-child { border-right: 0; }
  .DD-spec::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 4px; height: 100%;
    background: var(--ink-mute);
  }
  .DD-spec.ng::before { background: var(--lime); }
  .DD-spec.th::before { background: var(--cyan); }
  .DD-spec.na::before { background: var(--amber); }
  .DD-spec.ti::before { background: var(--magenta); }
  .DD-spec-k {
    font-family: var(--f-mono);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--ink-mute);
    text-transform: uppercase;
  }
  .DD-spec-v {
    font-family: var(--f-display);
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
    text-transform: uppercase;
    margin-top: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .DD-spec.ng .DD-spec-v { color: var(--lime); }
  .DD-spec.th .DD-spec-v { color: var(--cyan); }
  .DD-spec.na .DD-spec-v { color: var(--amber); }
  .DD-spec.ti .DD-spec-v { color: var(--magenta); }

  /* 2-col main body: notes (LEFT, bigger) + hour grid (RIGHT) */
  .DD-body-2col {
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    gap: 12px;
    flex: 1 1 auto;
    min-height: 0;
  }

  /* ─ NOTES + CHECKLIST ──────────────────────────────────────────────────
     Free-text note (textarea) stacked above a structured checklist.
     All inputs are always editable → live save on 'input' + 'change' events
     (handled in day-detail.js). */
  .DD-notes {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    min-height: 0;
    gap: 12px;
  }
  .DD-note-text {
    width: 100%;
    min-height: 80px;
    resize: vertical;
    font-family: var(--f-mono);
    font-size: 12px;
    background: var(--bg);
    color: var(--ink);
    border: 2px solid var(--ink-mute);
    padding: 10px;
    box-sizing: border-box;
    outline: none;
    flex: 0 0 auto;
  }
  .DD-note-text:focus { border-color: var(--lime); }
  .DD-note-text::placeholder { color: var(--ink-mute); }

  .DD-checklist {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    min-height: 0;
    border-top: 2px dashed var(--ink-mute);
    padding-top: 10px;
    gap: 8px;
  }
  .DD-todo-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
  }
  .DD-todo-title {
    font-family: var(--f-mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--lime);
    text-transform: uppercase;
  }
  .DD-todo-count {
    font-family: var(--f-mono);
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-dim);
    letter-spacing: 0.06em;
  }
  .DD-todo-progress {
    height: 3px;
    background: var(--bg);
    border: 1px solid var(--ink-mute);
    position: relative;
    flex: 0 0 auto;
  }
  .DD-todo-bar {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    background: var(--lime);
    transition: width 120ms ease;
  }
  .DD-todos {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow: auto;
    min-height: 0;
  }
  .DD-todo {
    display: grid;
    grid-template-columns: 18px 1fr 20px;
    align-items: center;
    gap: 8px;
    padding: 4px 2px;
    border-bottom: 1px dashed transparent;
  }
  .DD-todo:hover { border-bottom-color: var(--ink-mute); }
  .DD-todo-check {
    appearance: none;
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    margin: 0;
    border: 2px solid var(--ink);
    background: var(--bg);
    cursor: pointer;
    position: relative;
    flex: 0 0 auto;
  }
  .DD-todo-check:hover { border-color: var(--lime); }
  .DD-todo-check:checked {
    background: var(--lime);
    border-color: var(--lime);
  }
  .DD-todo-check:checked::after {
    content: '';
    position: absolute;
    left: 3px; top: -1px;
    width: 5px; height: 10px;
    border: solid #0a0a0b;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  .DD-todo-text {
    font-family: var(--f-mono);
    font-size: 13px;
    background: transparent;
    color: var(--ink);
    border: 0;
    outline: none;
    padding: 4px 2px;
    width: 100%;
    min-width: 0;
  }
  .DD-todo-text::placeholder { color: var(--ink-mute); }
  .DD-todo-text:focus { color: var(--ink); }
  .DD-todo.done .DD-todo-text {
    text-decoration: line-through;
    color: var(--ink-mute);
  }
  .DD-todo-del {
    background: transparent;
    border: 0;
    color: var(--ink-mute);
    font-size: 16px;
    line-height: 1;
    padding: 2px 4px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 80ms ease, color 80ms ease;
    font-family: var(--f-mono);
  }
  .DD-todo:hover .DD-todo-del,
  .DD-todo-del:focus { opacity: 1; }
  .DD-todo-del:hover { color: var(--red); }

  /* Ghost row — permanent placeholder at the top of the list.
     Typing + Enter (or blur) commits as a new todo. */
  .DD-todo-ghost {
    border-bottom: 2px dashed var(--ink-mute);
    padding-bottom: 8px;
    margin-bottom: 4px;
  }
  .DD-todo-check-ghost {
    width: 16px;
    height: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 2px dashed var(--ink-mute);
    color: var(--ink-mute);
    font-size: 14px;
    font-family: var(--f-mono);
    font-weight: 700;
    user-select: none;
    line-height: 1;
    transition: border-color 80ms ease, color 80ms ease;
  }
  .DD-todo-ghost:focus-within .DD-todo-check-ghost {
    border-color: var(--lime);
    border-style: solid;
    color: var(--lime);
  }
  .DD-todo-ghost .DD-todo-text {
    color: var(--ink-dim);
  }
  .DD-todo-ghost .DD-todo-text:focus { color: var(--ink); }
  .DD-todo-ghost .DD-todo-text::placeholder { color: var(--ink-mute); }
  .DD-todo-ghost .DD-todo-text:focus::placeholder { color: transparent; }
</style>

<!-- calendar.css is loaded AFTER the inline shell <style> so that responsive
     media queries at the bottom of calendar.css can override the view-specific
     base rules defined inline above (e.g. .DD-specs 4-col, .DD-body-2col
     1.3fr/1fr). Both files use equal-specificity class selectors, so the later
     one wins inside matching @media blocks. -->
<link rel="stylesheet" href="css/calendar.css">
</head>
<body>

<div id="page">
  <nav id="tabs" role="tablist" aria-label="Chế độ xem"></nav>
  <main id="view" aria-live="polite"></main>
</div>

<!-- vendor logic (pure JS, no deps) -->
<script src="js/amlich.js"></script>
<script src="js/holidays.js"></script>

<!-- app state + router glue -->
<script src="js/shell.js"></script>

<!-- views -->
<script src="js/month-view.js"></script>
<script src="js/day-detail.js"></script>
<script src="js/year-view.js"></script>

<!-- router + mount -->
<script src="js/app.js"></script>

<!-- donate chip → donate.aiocean.io. Appended to tab bar on ready. -->
<script>
(function () {
  function build() {
    const tabs = document.getElementById('tabs');
    if (!tabs) return;
    const a = document.createElement('a');
    a.id = 'ns-donate-chip';
    a.href = 'https://donate.aiocean.io/';
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.setAttribute('aria-label', 'Ủng hộ tác giả tại donate.aiocean.io');
    a.innerHTML = `
      <span class="ns-donate-ico"></span>
      <span class="ns-donate-lbl">DONATE</span>
      <span class="ns-donate-k">↗</span>
    `;
    tabs.appendChild(a);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', build);
  else build();
})();
</script>

</body>
</html>
